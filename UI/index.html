<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<title>V60</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h1>V60</h1>
  <p class="sub">A robotic arm pours over the V60 in a circular motion. Set the pour duration and the wait time, and add pours whenever you like.</p>
  <div class="grid">
    <section class="panel" aria-labelledby="h-recipe">
      <h2 id="h-recipe">Pours</h2>
      <div id="cards"></div>
      <div class="actions" style="margin-top:4px"><button class="btn alt" id="del">Delete last pour</button><button class="btn" id="plus" style="flex:1.4">+ Add pour</button></div>
    </section>

    <section class="panel stage" aria-labelledby="h-brew">
      <h2 id="h-brew" style="align-self:flex-start">Brew</h2>
      <svg viewBox="0 0 300 300" role="img" aria-label="Illustration of the robotic arm pouring water over the dripper">
        <g id="arm"><rect x="140" y="20" width="20" height="60" rx="6" fill="var(--mute)"/><path d="M135 80h30l-6 22h-18z" fill="var(--accent)"/><rect id="stream" x="148" y="102" width="4" height="0" fill="var(--water)"/></g>
        <path d="M80 130h140l-40 60h-60z" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
        <!-- <ellipse id="bed" cx="150" cy="134" rx="62" ry="5" fill="var(--coffee)"/> -->
        <rect x="110" y="196" width="80" height="80" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <rect id="cup" x="113" y="273" width="74" height="0" fill="var(--coffee)"/>
      </svg>
      <div class="phase" id="phase" aria-live="polite">Ready</div>
      <div class="bar"><i id="prog"></i></div>
      <div class="stats">
        <div class="stat"><b id="sPour">0/3</b><span>Pour</span></div>
        <div class="stat"><b id="sTime">0:00</b><span>Time</span></div>
        <div class="stat"><b id="sTotal">0:00</b><span>Total time</span></div>
      </div>
      <ul class="steps" id="steps"></ul>
      <div class="actions" style="margin-top:14px">
        <button class="btn" id="go">Start brew</button>
      </div>
    </section>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
